<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyperlush</title>

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="shortcut icon" href="favicon.ico">

  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue: #0a00db;
      --white: #f8fdee;
      --block: #ffffff;   /* color de los bloques del logo */
      --hit: #000000;     /* color del bloque en el momento del golpe */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: var(--blue);
      color: var(--white);
      font-family: "DM Mono", monospace;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* El logo es el instrumento: cada bloque es un pad */
    #pads {
      display: block;
      width: min(72vw, 480px); /* tamano del logo */
      height: auto;
      overflow: visible;
      touch-action: none; /* sin zoom ni desplazamiento al tocar rapido */
    }

    #pads rect {
      fill: var(--block);
      cursor: pointer;
      outline: none;
    }

    [hidden] { display: none !important; }

    .view {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Botones de texto, con la misma letra que el resto de la web */
    .text-btn {
      background: none;
      border: 0;
      color: var(--white);
      font: inherit;
      font-size: 12px;
      letter-spacing: 1px;
      padding: 10px 14px;
      cursor: pointer;
    }

    /* "WANNA PLAY?": arriba, lejos del logo. No se ve hasta que se toca un pad */
    #wanna {
      position: fixed;
      top: 34px;
      left: 50%;
      transform: translateX(-50%);
      border: 1px solid rgba(248, 253, 238, 0.4);
      padding: 6px 10px;
      font-size: 10px;
      letter-spacing: 1.5px;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s, visibility 0s 0.6s;
    }

    #wanna.show {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.6s;
    }

    /* ---------- Secuenciador ---------- */
    /* Nombres en una columna a la izquierda; el compas va de izquierda a derecha.
       Arriba, los numeros 1 2 3 4 marcan los cuatro tiempos (donde va el bombo) */
    #grid {
      --label: 78px;
      --cell-h: 44px;
      --gap: 4px;
      --beat: 3px; /* separacion extra entre un tiempo y el siguiente */
      display: grid;
      grid-template-columns:
        var(--label)
        repeat(4, 1fr) var(--beat) repeat(4, 1fr) var(--beat)
        repeat(4, 1fr) var(--beat) repeat(4, 1fr);
      gap: var(--gap);
      width: min(92vw, 720px);
      touch-action: none; /* para poder arrastrar el dedo por las casillas */
    }

    #grid .num {
      grid-column: calc(var(--p) + 2);
      grid-row: 1;
      font-size: 10px;
      text-align: center;
      opacity: 0.8;
      padding-bottom: 2px;
      pointer-events: none;
    }

    #grid .label { grid-column: 1; grid-row: calc(var(--r) + 2); }
    #grid .cell { grid-column: calc(var(--p) + 2); grid-row: calc(var(--r) + 2); }

    #grid .label {
      background: none;
      border: 0;
      color: var(--white);
      font: inherit;
      font-size: 11px;
      letter-spacing: 1px;
      text-align: left;
      cursor: pointer;
      height: var(--cell-h);
    }

    #grid .cell {
      height: var(--cell-h);
      background: transparent;
      border: 1px solid rgba(248, 253, 238, 0.55);
      border-radius: 0;
      cursor: pointer;
      padding: 0;
    }

    #grid .cell.on {
      background: var(--block);
      border-color: var(--block);
    }

    /* columnas mas claras: los cuatro tiempos del compas (1, 2, 3, 4) */
    #grid .cell.beat:not(.on) { background: rgba(248, 253, 238, 0.2); }

    /* paso que esta sonando ahora */
    #grid .cell.now:not(.on) { background: rgba(248, 253, 238, 0.45); }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 34px;
    }

    #playBtn {
      border: 1px solid rgba(248, 253, 238, 0.7);
      min-width: 92px;
      padding: 12px 20px;
    }

    .back {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 34px;
      text-align: center;
      font-size: 12px;
    }

    .back a {
      color: var(--white);
      text-decoration: none;
      padding: 10px 14px;
    }

    @media (max-width: 700px) {
      #wanna { top: 26px; }

      /* En movil se ven y suenan solo los 2 primeros tiempos (8 casillas),
         para que cada casilla sea grande y facil de tocar */
      #grid {
        --label: 54px;
        --cell-h: 40px;
        --gap: 3px;
        grid-template-columns: var(--label) repeat(4, 1fr) var(--beat) repeat(4, 1fr);
        width: min(96vw, 720px);
      }

      #grid .second { display: none; }

      #grid .label { font-size: 10px; letter-spacing: 0.5px; }

      .controls { margin-top: 26px; gap: 4px; }
      .back { bottom: 26px; }
    }
  </style>
</head>

<body>

  <!-- PANTALLA 1: el logo, cada bloque es un pad -->
  <section class="view" id="viewLogo">

  <!-- Mismas medidas que assets/hyperlush-logo-website.svg -->
  <svg id="pads" viewBox="0 0 1146.63 445.93" role="group" aria-label="Hyperlush logo drum pads">
    <rect data-pad="hat"     x="0"      y="0"      width="335.08" height="148.64" role="button" aria-label="Hi-hat"/>
    <rect data-pad="cowbell" x="811.56" y="0"      width="335.08" height="148.64" role="button" aria-label="Cowbell"/>
    <rect data-pad="kick"    x="335.08" y="148.64" width="476.48" height="148.64" role="button" aria-label="Kick"/>
    <rect data-pad="tom"     x="0"      y="297.29" width="335.08" height="148.64" role="button" aria-label="Tom"/>
    <rect data-pad="clap"    x="811.56" y="297.29" width="335.08" height="148.64" role="button" aria-label="Clap"/>
  </svg>

  <button class="text-btn" id="wanna" type="button">WANNA PLAY?</button>

  </section>

  <!-- PANTALLA 2: el secuenciador (las casillas las crea el codigo de abajo) -->
  <section class="view" id="viewSeq" hidden>
    <div id="grid" role="group" aria-label="Step sequencer"></div>
    <div class="controls">
      <button class="text-btn" id="playBtn" type="button">PLAY</button>
      <button class="text-btn" id="clearBtn" type="button">CLEAR</button>
      <button class="text-btn" id="closeBtn" type="button">CLOSE</button>
    </div>
  </section>

  <p class="back"><a href="index.html">©2026 HYPERLUSH</a></p>

  <script>
    // ------------------------------------------------------------
    // AJUSTES
    // ------------------------------------------------------------

    // Volumen de cada sonido (0 = silencio, 1 = maximo)
    const LEVEL = { kick: 1.0, clap: 0.75, hat: 0.45, tom: 0.85, cowbell: 0.6 };

    // Volumen general
    const MASTER = 0.8;

    // Secuenciador: velocidad (16 pasos = un compas; en movil, 8 pasos = medio compas)
    const BPM = 124;

    // Ritmo que ya viene marcado al abrir el secuenciador (x = marcado, . = vacio).
    // Para que empiece vacio, deja las cinco lineas con todo puntos.
    const START_PATTERN = {
      kick:    "x...x...x...x...",
      clap:    "....x.......x...",
      hat:     "..x...x...x...x.",
      tom:     "................",
      cowbell: "................"
    };

    // Teclas del ordenador: 1 2 3 4 5 (y la barra espaciadora = bombo;
    // con el secuenciador abierto, la barra espaciadora = play / stop)
    const KEYS = {
      Digit1: "kick", Digit2: "clap", Digit3: "hat", Digit4: "tom", Digit5: "cowbell",
      Numpad1: "kick", Numpad2: "clap", Numpad3: "hat", Numpad4: "tom", Numpad5: "cowbell",
      Space: "kick"
    };

    // Sonidos propios (opcional): si existe la carpeta "sounds" con estos archivos,
    // se usan en lugar de los sonidos generados. Si no existen, no pasa nada.
    const SAMPLE_FILES = {
      kick: "sounds/kick.wav",
      clap: "sounds/clap.wav",
      hat: "sounds/hat.wav",
      tom: "sounds/tom.wav",
      cowbell: "sounds/cowbell.wav"
    };

    // ------------------------------------------------------------
    // SONIDOS GENERADOS (sin archivos): estilo 909 y cencerro estilo 808
    // Cada funcion recibe: ac = motor de audio, out = salida, t = momento
    // ------------------------------------------------------------
    const noiseCache = new WeakMap();

    function noiseBuffer(ac) {
      let b = noiseCache.get(ac);
      if (!b) {
        b = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const d = b.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        noiseCache.set(ac, b);
      }
      return b;
    }

    function noise(ac, t, dur) {
      const n = ac.createBufferSource();
      n.buffer = noiseBuffer(ac);
      n.loop = true;
      n.start(t, Math.random() * 0.5);
      n.stop(t + dur);
      return n;
    }

    function osc(ac, type, freq, t, dur) {
      const o = ac.createOscillator();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      o.start(t);
      o.stop(t + dur);
      return o;
    }

    function gain(ac, value) {
      const g = ac.createGain();
      g.gain.value = value;
      return g;
    }

    function filter(ac, type, freq, q) {
      const f = ac.createBiquadFilter();
      f.type = type;
      f.frequency.value = freq;
      if (q) f.Q.value = q;
      return f;
    }

    // Saturacion suave, para dar cuerpo
    function drive(ac, amount) {
      const s = ac.createWaveShaper();
      const c = new Float32Array(1024);
      for (let i = 0; i < c.length; i++) {
        const x = (i / (c.length - 1)) * 2 - 1;
        c[i] = Math.tanh(x * amount) / Math.tanh(amount);
      }
      s.curve = c;
      return s;
    }

    const VOICES = {

      // Bombo estilo 909: tono que cae muy rapido + chasquido corto
      kick(ac, out, t) {
        const o = osc(ac, "sine", 240, t, 0.7);
        o.frequency.exponentialRampToValueAtTime(60, t + 0.045);
        o.frequency.exponentialRampToValueAtTime(48, t + 0.4);
        const g = gain(ac, 0);
        g.gain.setValueAtTime(1, t);
        g.gain.setValueAtTime(1, t + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
        o.connect(g).connect(drive(ac, 1.8)).connect(out);

        const n = noise(ac, t, 0.03);
        const ng = gain(ac, 0);
        ng.gain.setValueAtTime(0.2, t);
        ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.018);
        n.connect(filter(ac, "lowpass", 5000)).connect(ng).connect(out);
      },

      // Clap estilo 909: ruido filtrado, tres golpes muy seguidos y una cola
      clap(ac, out, t) {
        const n = noise(ac, t, 0.4);
        const g = gain(ac, 0);
        for (let i = 0; i < 3; i++) {
          g.gain.setValueAtTime(2.7, t + i * 0.01);
          g.gain.exponentialRampToValueAtTime(0.4, t + i * 0.01 + 0.009);
        }
        g.gain.setValueAtTime(2.4, t + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
        n.connect(filter(ac, "bandpass", 1150, 1.3))
         .connect(filter(ac, "highpass", 700))
         .connect(g).connect(out);
      },

      // Hat cerrado estilo 909: ruido y tonos metalicos, solo agudos, muy corto
      hat(ac, out, t) {
        const mix = gain(ac, 1);
        for (const r of [2, 3, 4.16, 5.43, 6.79, 8.21]) {
          osc(ac, "square", 40 * r * 1.3, t, 0.12).connect(gain(ac, 0.12)).connect(mix);
        }
        noise(ac, t, 0.12).connect(gain(ac, 0.7)).connect(mix);
        const g = gain(ac, 0);
        g.gain.setValueAtTime(1.4, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
        mix.connect(filter(ac, "highpass", 7000))
           .connect(filter(ac, "bandpass", 10000, 0.6))
           .connect(g).connect(out);
      },

      // Tom medio estilo 909: dos tonos que caen + un poco de ruido en el ataque
      tom(ac, out, t) {
        const f0 = 150;
        const shaper = drive(ac, 1.4);
        shaper.connect(out);

        const o1 = osc(ac, "sine", f0 * 1.9, t, 0.6);
        o1.frequency.exponentialRampToValueAtTime(f0, t + 0.09);
        const g1 = gain(ac, 0);
        g1.gain.setValueAtTime(0.9, t);
        g1.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
        o1.connect(g1).connect(shaper);

        const o2 = osc(ac, "sine", f0 * 2.8, t, 0.3);
        o2.frequency.exponentialRampToValueAtTime(f0 * 1.5, t + 0.07);
        const g2 = gain(ac, 0);
        g2.gain.setValueAtTime(0.28, t);
        g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
        o2.connect(g2).connect(shaper);

        const n = noise(ac, t, 0.08);
        const ng = gain(ac, 0);
        ng.gain.setValueAtTime(0.18, t);
        ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
        n.connect(filter(ac, "lowpass", 1500)).connect(ng).connect(out);
      },

      // Cencerro estilo 808: dos ondas cuadradas (540 y 800 Hz) por un filtro
      cowbell(ac, out, t) {
        const band = filter(ac, "bandpass", 2640, 1);
        osc(ac, "square", 540, t, 0.5).connect(gain(ac, 0.5)).connect(band);
        osc(ac, "square", 800, t, 0.5).connect(gain(ac, 0.5)).connect(band);
        const g = gain(ac, 0);
        g.gain.setValueAtTime(1.7, t);
        g.gain.exponentialRampToValueAtTime(0.5, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
        band.connect(g).connect(out);
      }
    };

    // ------------------------------------------------------------
    // MOTOR DE AUDIO
    // ------------------------------------------------------------
    let ac = null, master = null;
    const samples = {};

    function setupAudio() {
      if (ac) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;

      // En iPhone: que suene aunque el movil este en silencio
      try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}

      ac = new AC({ latencyHint: "interactive" });

      // Limitador: evita distorsion si se tocan varios a la vez
      const limiter = ac.createDynamicsCompressor();
      limiter.threshold.value = -6;
      limiter.knee.value = 4;
      limiter.ratio.value = 12;
      limiter.attack.value = 0.002;
      limiter.release.value = 0.12;

      master = ac.createGain();
      master.gain.value = MASTER;
      master.connect(limiter).connect(ac.destination);

      loadSamples();
    }

    // Sonidos propios: solo se usan los que existan y se puedan leer
    function loadSamples() {
      if (location.protocol === "file:") return;
      for (const name of Object.keys(SAMPLE_FILES)) {
        fetch(SAMPLE_FILES[name])
          .then((r) => (r.ok ? r.arrayBuffer() : Promise.reject()))
          .then((data) => new Promise((ok, no) => {
            const p = ac.decodeAudioData(data, ok, no);
            if (p && p.catch) p.catch(() => {});
          }))
          .then((buffer) => { samples[name] = buffer; })
          .catch(() => {});
      }
    }

    // when = momento exacto en que debe sonar (si no se indica, ahora)
    function play(name, when) {
      setupAudio();
      if (!ac) return;
      if (ac.state !== "running") ac.resume();

      const t = when || ac.currentTime;
      const out = ac.createGain();
      out.gain.value = LEVEL[name];
      out.connect(master);

      if (samples[name]) {
        const s = ac.createBufferSource();
        s.buffer = samples[name];
        s.connect(out);
        s.start(t);
      } else {
        VOICES[name](ac, out, t);
      }
    }

    // ------------------------------------------------------------
    // PADS
    // ------------------------------------------------------------
    const svg = document.getElementById("pads");
    const wanna = document.getElementById("wanna");
    const pads = {};
    svg.querySelectorAll("rect").forEach((r) => { pads[r.dataset.pad] = r; });

    const css = getComputedStyle(document.documentElement);
    const COLOR_BLOCK = css.getPropertyValue("--block").trim();
    const COLOR_HIT = css.getPropertyValue("--hit").trim();
    const calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // Parpadeo de golpe: negro un instante y vuelve a su color
    function blink(el, prop) {
      if (!el.animate) return;
      el.getAnimations().forEach((a) => a.cancel());
      el.animate(
        [{ [prop]: COLOR_HIT }, { [prop]: COLOR_HIT, offset: 0.25 }, { [prop]: COLOR_BLOCK }],
        { duration: 220, easing: "linear" }
      );
    }

    function flash(name) {
      const r = pads[name];
      if (!r.animate) return;
      r.getAnimations().forEach((a) => a.cancel());
      r.animate(
        [{ fill: COLOR_HIT }, { fill: COLOR_HIT, offset: 0.25 }, { fill: COLOR_BLOCK }],
        { duration: 220, easing: "linear" }
      );
      // el bombo empuja un poco todo el logo
      if (name === "kick" && !calm) {
        svg.getAnimations().forEach((a) => a.cancel());
        svg.animate(
          [{ transform: "scale(1.03)" }, { transform: "scale(1)" }],
          { duration: 160, easing: "ease-out" }
        );
      }
    }

    function hit(name) {
      play(name);
      flash(name);
      wanna.classList.add("show"); // aparece despues del primer golpe
    }

    svg.addEventListener("pointerdown", (e) => {
      const name = e.target && e.target.dataset && e.target.dataset.pad;
      if (!name) return;
      e.preventDefault();
      hit(name);
    });

    svg.addEventListener("contextmenu", (e) => e.preventDefault());

    document.addEventListener("keydown", (e) => {
      if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.code === "Escape") {
        if (seqOpen()) closeSeq(); else window.location.href = "index.html";
        return;
      }
      if (e.code === "Space" && seqOpen()) { e.preventDefault(); togglePlay(); return; }
      const name = KEYS[e.code];
      if (!name) return;
      e.preventDefault();
      hit(name);
    });

    // La barra espaciadora no debe ademas "pulsar" el boton que tenga el foco
    document.addEventListener("keyup", (e) => { if (e.code === "Space") e.preventDefault(); });

    // ------------------------------------------------------------
    // SECUENCIADOR: 5 sonidos x 16 pasos, en bucle
    // ------------------------------------------------------------
    const ROWS = [
      ["kick", "KICK"], ["clap", "CLAP"], ["hat", "HAT"], ["tom", "TOM"], ["cowbell", "COWBELL"]
    ];
    const STEPS = 16;
    const STEP_SEC = 60 / BPM / 4; // cada paso es una semicorchea
    // En pantallas estrechas (movil) el bucle es de 8 pasos; en el resto, de 16.
    // Debe coincidir con el "max-width: 700px" de los estilos.
    const narrow = window.matchMedia("(max-width: 700px)");
    const loopSteps = () => (narrow.matches ? STEPS / 2 : STEPS);
    const marks = (text) => Array.from({ length: STEPS }, (_, i) => (text[i] === "x" ? 1 : 0));

    const viewLogo = document.getElementById("viewLogo");
    const viewSeq = document.getElementById("viewSeq");
    const grid = document.getElementById("grid");
    const playBtn = document.getElementById("playBtn");

    const pattern = {};
    const cells = {};
    for (const [name] of ROWS) pattern[name] = marks(START_PATTERN[name]);

    // Numeros de los cuatro tiempos, encima de la rejilla
    for (let beat = 0; beat < STEPS / 4; beat++) {
      const n = document.createElement("div");
      n.className = beat >= 2 ? "num second" : "num";
      n.textContent = beat + 1;
      n.style.setProperty("--p", beat * 4 + beat);
      grid.appendChild(n);
    }

    // Crear las casillas
    ROWS.forEach(([name, text], row) => {
      const label = document.createElement("button");
      label.type = "button";
      label.className = "label";
      label.textContent = text;
      label.dataset.sound = name;
      label.style.setProperty("--r", row);
      grid.appendChild(label);

      cells[name] = [];
      for (let i = 0; i < STEPS; i++) {
        const c = document.createElement("button");
        c.type = "button";
        c.className = i >= STEPS / 2 ? "cell second" : "cell";
        c.dataset.sound = name;
        c.dataset.step = i;
        c.style.setProperty("--r", row);
        c.style.setProperty("--p", i + Math.floor(i / 4)); // deja un hueco entre tiempos
        if (i % 4 === 0) c.classList.add("beat"); // columna de tiempo: mas clara
        c.setAttribute("aria-label", text + " step " + (i + 1));
        grid.appendChild(c);
        cells[name].push(c);
      }
    });

    function paint() {
      for (const [name] of ROWS) {
        cells[name].forEach((c, i) => {
          const on = !!pattern[name][i];
          c.classList.toggle("on", on);
          c.setAttribute("aria-pressed", on ? "true" : "false");
        });
      }
    }
    paint();

    function setCell(name, i, value) {
      if (pattern[name][i] === value) return;
      pattern[name][i] = value;
      paint();
      if (value && !playing) play(name); // con el ritmo parado, se oye lo que marcas
    }

    // Que casilla de esa fila queda bajo el dedo (-1 si ninguna)
    function stepAt(name, x) {
      const row = cells[name];
      const n = loopSteps(); // solo las casillas que se ven
      const first = row[0].getBoundingClientRect();
      const last = row[n - 1].getBoundingClientRect();
      if (x < first.left) return 0;
      if (x > last.right) return n - 1;
      for (let i = 0; i < n; i++) {
        const next = i < n - 1 ? row[i + 1].getBoundingClientRect().left : last.right;
        if (x < next) return i;
      }
      return n - 1;
    }

    // Tocar una casilla la marca o la desmarca. Si se arrastra el dedo (o el raton)
    // por la fila, todas las casillas por las que pasa quedan igual que la primera.
    let drag = null;

    grid.addEventListener("pointerdown", (e) => {
      const el = e.target;
      const name = el && el.dataset && el.dataset.sound;
      if (!name) return;
      if (el.classList.contains("label")) { play(name); return; } // tocar el nombre = escuchar el sonido
      e.preventDefault();
      const i = +el.dataset.step;
      drag = { id: e.pointerId, name: name, value: pattern[name][i] ? 0 : 1, last: i };
      try { grid.setPointerCapture(e.pointerId); } catch (err) {}
      setCell(name, i, drag.value);
    });

    grid.addEventListener("pointermove", (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const i = stepAt(drag.name, e.clientX);
      const from = Math.min(i, drag.last), to = Math.max(i, drag.last);
      for (let k = from; k <= to; k++) setCell(drag.name, k, drag.value); // sin saltarse ninguna
      drag.last = i;
    });

    const endDrag = (e) => { if (drag && e.pointerId === drag.id) drag = null; };
    grid.addEventListener("pointerup", endDrag);
    grid.addEventListener("pointercancel", endDrag);

    // --- reloj: los golpes se programan con un poco de antelacion para que no bailen ---
    let playing = false, nextStep = 0, nextTime = 0, clock = null, frame = 0, queue = [], shown = -1;

    function schedule() {
      if (!ac) return;
      if (nextTime < ac.currentTime - 0.05) nextTime = ac.currentTime + 0.05; // si el navegador se atraso
      while (nextTime < ac.currentTime + 0.12) {
        if (nextStep >= loopSteps()) nextStep = 0; // por si se gira el movil mientras suena
        for (const [name] of ROWS) if (pattern[name][nextStep]) play(name, nextTime);
        queue.push({ step: nextStep, time: nextTime });
        nextTime += STEP_SEC;
        nextStep = (nextStep + 1) % loopSteps();
      }
    }

    function showStep(step) {
      for (const [name] of ROWS) {
        if (shown >= 0) cells[name][shown].classList.remove("now");
        if (step >= 0) {
          cells[name][step].classList.add("now");
          if (pattern[name][step]) blink(cells[name][step], "backgroundColor");
        }
      }
      shown = step;
    }

    function draw() {
      if (!playing) return;
      let step = -1;
      while (queue.length && queue[0].time <= ac.currentTime) step = queue.shift().step;
      if (step >= 0) showStep(step);
      frame = requestAnimationFrame(draw);
    }

    function startSeq() {
      setupAudio();
      if (!ac || playing) return;
      if (ac.state !== "running") ac.resume();
      playing = true;
      nextStep = 0;
      nextTime = ac.currentTime + 0.06;
      queue = [];
      schedule();
      clock = setInterval(schedule, 25);
      frame = requestAnimationFrame(draw);
      playBtn.textContent = "STOP";
    }

    function stopSeq() {
      playing = false;
      clearInterval(clock);
      cancelAnimationFrame(frame);
      queue = [];
      showStep(-1);
      playBtn.textContent = "PLAY";
    }

    function togglePlay() { if (playing) stopSeq(); else startSeq(); }

    function seqOpen() { return !viewSeq.hidden; }

    function openSeq() {
      viewLogo.hidden = true;
      viewSeq.hidden = false;
      document.body.classList.add("seq-open");
    }

    function closeSeq() {
      stopSeq();
      viewSeq.hidden = true;
      viewLogo.hidden = false;
      document.body.classList.remove("seq-open");
    }

    wanna.addEventListener("click", openSeq);
    document.getElementById("closeBtn").addEventListener("click", closeSeq);
    playBtn.addEventListener("click", togglePlay);
    document.getElementById("clearBtn").addEventListener("click", () => {
      for (const [name] of ROWS) pattern[name].fill(0);
      paint();
    });

    // Si la persona cambia de pestana o bloquea el movil, el ritmo se para
    document.addEventListener("visibilitychange", () => { if (document.hidden && playing) stopSeq(); });

    // Se prepara el audio al cargar; el navegador lo activa con el primer toque
    setupAudio();
  </script>
</body>
</html>
